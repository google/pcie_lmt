// PCI config space proto used for PCIe link training test, for both the input
// and the result.
syntax = "proto3";

package ltt;

option go_package = 'ltt_go_proto';

message LinkTrainTests {
  repeated LinkTrain link_train = 1;
}

// Identifies a PCIe link by the PCI <vendor_id, device_id> and the BDFs of
// both of its ends, which disambiguates links whose USPs share the same IDs,
// e.g. a NIC whose internal downstream port has the same IDs as its external
// upstream port, or a switch whose ports all share the same IDs.
// All set fields are ANDed. An unset field is a wildcard that matches any
// value. The IDs are 16-bit PCI IDs; protobuf has no uint16 type.
// At least one of the six filter fields (usp_vendor_id, usp_device_id,
// usp_bdfs, dsp_vendor_id, dsp_device_id, dsp_bdfs) must be set, unless
// all_links is true. Otherwise the test fails before any link is touched.
message PcieLinkTarget {
  optional uint32 usp_vendor_id = 1;
  optional uint32 usp_device_id = 2;
  // The link's USP must be one of these BDFs, in the format of
  // "0000:00:00.0". An empty list is a wildcard. A malformed BDF is an error.
  repeated string usp_bdfs = 3;
  optional uint32 dsp_vendor_id = 4;
  optional uint32 dsp_device_id = 5;
  // The link's DSP must be one of these BDFs, in the format of
  // "0000:00:00.0". An empty list is a wildcard. A malformed BDF is an error.
  repeated string dsp_bdfs = 6;
  // Explicitly selects every eligible link in the system when no filter field
  // is set. Any filter field that is set still applies.
  optional bool all_links = 7;
}

message LinkTrain {
  // The former USP filters vendor_id = 1, device_id = 2 and bdf = 3, replaced
  // by link_target. Only the numbers are reserved, not the names: Go prototext
  // and C++ TextFormat silently skip a reserved field name, so a spec that
  // still sets a legacy filter would silently lose it, and could select every
  // link, instead of failing to parse.
  reserved 1, 2, 3;

  // Output only. The BDFs of the USP and the DSP of the tested link, where
  // secondary bus reset is issued.
  optional string usp_bdf = 4;
  optional string dsp_bdf = 5;

  // Selects the links to test by the IDs and the BDFs of both of their ends.
  // Required: an unset or empty link_target is rejected, unless
  // link_target.all_links is true.
  optional PcieLinkTarget link_target = 20;

  int32 iterations = 6;  // number of link training iterations

  optional int32 pass_count = 7;  // number of successful link training
  optional int32 fail_count = 8;  // number of failed link training

  // If not set or true, the iterations continue after the first failure.
  optional bool continue = 9;

  // Link training methods
  enum Method {
    M_RETRAIN_DEFAULT = 0;  // Link Retrain, the default
    M_SBR = 1;              // Secondary Bus Reset
    M_REENABLE = 2;         // Link disable and re-enable
    M_RETRAIN_WITH_EQ = 3;  // Link Retrain with Perform Equalization bit set
  }

  Method method = 10;

  // Wait time per training iteration in ms, normally 100ms for all methods.
  uint32 training_wait_ms = 11;

  // Wait time after disable polling finished in ms before enabling the link.
  // This is only used for M_REENABLE.
  uint32 reenable_wait_ms_after_disable = 18;

  // Only when set to true, test each link in parallel, otherwise, in series.
  optional bool parallel = 12;
  optional string extra_info = 13;

  // This message defines a PCI config space field to be checked or logged.
  message PciConfigField {
    string name = 1;  // name of the field; no functional use

    enum StateEnum {
      S_LOG = 0;      // to be logged
      S_LOGGED = 1;   // logged
      S_CHECK = 2;    // to be checked
      S_PASS = 3;     // checked and the value is expected
      S_FAIL = 4;     // checked and the value is not expected
      S_ERROR = 5;    // This field definition has error
      S_RECOVER = 6;  // Record before testing and write-back after.
    }

    StateEnum state = 2;

    // The field's byte offset into the config space
    uint32 addr = 3;

    // Width of the field.
    enum SizeEnum {
      UINT8 = 0;
      UINT16 = 1;
      UINT32 = 2;
      UINT64 = 3;
    }

    SizeEnum size = 4;

    uint32 mask = 5;  // bit mask of the field.

    optional uint32 val = 6;       // logged value
    optional uint32 expected = 7;  // expected value for checking
  }

  repeated PciConfigField field = 15;
  // If this field is true, we dynamically add S_RECOVER PciConfigField to
  // recover the first 0x40 bytes of the config space, which is the
  // PCI-Compatible Config Space Header according to Spec 7.2 or 7.5.1.1.
  bool recover_pci_config_space_header = 16;
  // If this field is set to true, we dynamically adds S_RECOVER PciConfigField
  // to recover all control registers in the PCIe Capability Structure defined
  // in Spec 7.5.3.
  bool recover_pcie_cap_ctrl_regs = 17;
  // Whether to automatically search for and recover the SR-IOV capability
  // structure registers. When true, dynamically adds S_RECOVER PciConfigField
  // to recover all 16 DWORDs (64 bytes) in the SR-IOV Extended Capability
  // Structure defined in PCIe Spec 6.4 Section 9.4.
  bool recover_sriov_cap_regs = 19;
}
