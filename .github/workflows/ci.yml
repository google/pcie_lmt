name: CI

on:
  push:
    branches:
      - master
      - main
      - "test_**"
  pull_request:
    branches:
      - master
      - main

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    env:
      USE_BAZEL_VERSION: "7.5.0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpci-dev

      - name: Build targets (static link)
        run: bazel build //:lmt //ltt:ltt

      - name: Run unit tests
        run: bazel test --test_output=errors //...

      - name: Build targets (dynamic link)
        run: bazel build --define pci_link=dynamic //:lmt //ltt:ltt

      - name: Build targets (linux_arm64_cgo cross-compile)
        run: bazel build --platforms=@io_bazel_rules_go//go/toolchain:linux_arm64_cgo //:lmt //ltt:ltt
